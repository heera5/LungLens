{% extends 'base_classic.html' %}
{% set bg_image = '2.jpg' %}
{% block title %}Signup - LungLens{% endblock %}
{% block card_class %}light{% endblock %}
{% block content %}
<h2>Signup</h2>
<form method="POST" action="{{ url_for('signup') }}">
  <input type="text" name="username" placeholder="Username" required autofocus>
  <input type="email" name="email" placeholder="Email" required>
  <input type="password" name="password" placeholder="Password" minlength="4" required>
  <button type="submit" class="btn full" style="margin-top:4px;">Signup</button>
</form>
<div class="link">Already have an account? <a href="{{ url_for('login') }}">Login</a></div>
<div class="link"><a href="{{ url_for('home') }}">&larr; Home</a></div>
{% endblock %}
